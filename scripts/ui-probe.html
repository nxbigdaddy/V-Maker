function scrollReachable(el,stop) {

  let node=document.getElementById('probe-result');if(!node){node=document.createElement('script');node.id='probe-result';node.type='application/json';document.body.append(node);}
  node.textContent=JSON.stringify(result);
  document.getElementById('report').textContent=result.cases.map(c=>`[${c.status==='passed'?'正常':'问题'}] ${c.width}x${c.height} · ${c.scenario}\n${c.issues.map(i=>'  '+i.kind+': '+i.detail).join('\n')}`).join('\n')+`\n=== ${result.status} (${result.cases.length} cases) ===`;
}
async function warmUp() {
  // 第一个 iframe 是冷启动：生产包要下载执行、后端请求也要跑一轮，很容易超过单个用例的等待上限。
  // 先加载一次并丢掉结果，让后面的用例都不是冷启动，避免偶发红。
  const frame=document.createElement('iframe');frame.width=760;frame.height=760;frame.src='/';
  const loaded=new Promise((resolve)=>{frame.onload=resolve;setTimeout(resolve,20000);});
  document.getElementById('stage').append(frame);
  await loaded;
  const doc=frame.contentDocument;
  if(doc){ try{ await until(()=>doc.querySelector('button'),'warm-up mounted',20000); }catch{} }
  frame.remove();
}
async function run() {
  const names=query.get('scenarios')?.split(',');
  if(names?.some(name=>!SCENARIOS.some(s=>s.name===name))) throw Error('Unknown scenario name');
  const selected=SCENARIOS.filter(s=>!names||names.includes(s.name));
  const result={status:'running',experimentalCssZoom:ZOOM!==1,cases:[],limitations:['CSS zoom is experimental, not browser zoom; acceptance runs must use zoom=1','No screenshot inspection','Existing first project; project data branches are not exhaustively covered','Each visible button/link is scrolled into view and center hit-tested; disabled controls are measured but not activated','Not all loading/error/task status branches or screenshot aesthetics are covered']};
  await warmUp();
  for(const width of WIDTHS) for(const height of HEIGHTS) for(const scenario of selected) {
    const frame=document.createElement('iframe');frame.width=width;frame.height=height;
    const entry={width,height,scenario:scenario.name,status:'failed',issues:[]};
    try {
      const loaded=new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('iframe load timeout')),12000);});
      frame.src='/';document.getElementById('stage').append(frame);await loaded;
      const doc=frame.contentDocument,win=frame.contentWindow;
      if(!doc) throw Error('无法访问同源文档');
      await until(()=>doc.querySelector('button'),'React mounted');
      doc.documentElement.style.zoom=String(ZOOM);
      entry.zoom=ZOOM;
      await scenario.run(doc);
      await doc.fonts.ready;await sleep(350);
      entry.actualTitle=doc.querySelector('.wizard-page h3')?.textContent||doc.querySelector('.workspace-nav [aria-current]')?.getAttribute('aria-label')||doc.querySelector('[role="dialog"] h2')?.textContent||'首页';
      const audit=await auditPositions(win,doc);entry.issues=audit.issues;entry.buttons=audit.positions;entry.status=entry.issues.length?'failed':'passed';
    } catch(error) {entry.issues.push({kind:'scenario-failed',detail:String(error.message||error)});}
    finally {frame.remove();}
    result.cases.push(entry);publish(result);
  }
  result.status=result.cases.some(c=>c.status!=='passed')?'failed':'passed';publish(result);
}
run().catch(error=>publish({status:'failed',cases:[{scenario:'probe configuration',status:'failed',issues:[{kind:'fatal',detail:String(error)}]}]}));
</script></body></html>
