<!doctype html><meta charset="utf-8"><pre id="report">running</pre><script>
(async()=>{const out=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(const width of [320,360,420,480,701,760]) {const f=document.createElement('iframe');f.width=width;f.height=480;f.src='/';document.body.append(f);await new Promise(r=>f.onload=r);await sleep(700);const d=f.contentDocument;d.querySelector('[aria-label="模型设置"]').click();await sleep(800);d.documentElement.style.zoom='1.5';await sleep(100);const footer=d.querySelector('.settings-modal footer');const b=[...footer.querySelectorAll('button')];out.push({width,footer:footer.getBoundingClientRect().toJSON(),buttons:b.map(e=>{const range=d.createRange();range.selectNodeContents(e);return {text:e.textContent,box:e.getBoundingClientRect().toJSON(),content:range.getBoundingClientRect().toJSON(),scroll:e.scrollWidth,client:e.clientWidth}})});f.remove();}document.querySelector('#report').textContent=JSON.stringify(out,null,2)})().catch(e=>document.querySelector('#report').textContent=String(e));</script>
